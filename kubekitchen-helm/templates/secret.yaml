{{/*
  kubekitchen-helm/templates/secret.yaml
  ─────────────────────────────────────────────────────────────
  DEV  (global.blueGreen = false):
       Creates a plain Secret from values.yaml — convenient for
       local dev / testing. Values here are NOT sensitive.

  PROD (global.blueGreen = true):
       Does NOT render a Secret. The real kubekitchen-secrets is
       managed as a SealedSecret in sealed-secrets/ folder.
       ArgoCD decrypts and applies it via Sealed Secrets controller.

  ⚠️  NEVER commit real credentials to values.yaml!
      Use sealed-secrets/sealed-secret-prod.yaml for production.
*/}}

{{- if not .Values.global.blueGreen }}
# ─── DEV: Plain Secret (non-sensitive dev values only) ────────
apiVersion: v1
kind: Secret
metadata:
  name: kubekitchen-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: kubekitchen
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    project: {{ .Values.global.project }}
    environment: {{ .Values.global.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.global.jwtSecret | quote }}
  MONGO_AUTH_URI: {{ .Values.global.mongoUris.auth | quote }}
  MONGO_RESTAURANT_URI: {{ .Values.global.mongoUris.restaurant | quote }}
  MONGO_MENU_URI: {{ .Values.global.mongoUris.menu | quote }}
  MONGO_ORDER_URI: {{ .Values.global.mongoUris.order | quote }}
{{- end }}
{{/* PROD: Secret is provided by SealedSecret in sealed-secrets/ folder */}}
