# ── Frontend ─────────────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: "secretpower/kubekitchen-frontend"
    tag: ""
    pullPolicy: ""
  service:
    port: 8080
    targetPort: 8080
    type: ClusterIP
  resources:
    requests:
      memory: "64Mi"
      cpu: "20m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  probes:
    liveness:
      path: /health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 15
    readiness:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    startup:
      path: /health
      port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
      failureThreshold: 10
# ── MongoDB ──────────────────────────────────────────────────
mongodb:
  enabled: true
  image:
    repository: "mongo"
    tag: "7"
    pullPolicy: IfNotPresent
  storage:
    size: "5Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "300m"
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  probes:
    liveness:
      initialDelaySeconds: 40
      periodSeconds: 20
      timeoutSeconds: 10
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
# ── Seeder Job ───────────────────────────────────────────────
seeder:
  enabled: true
  image:
    repository: "secretpower/kubekitchen-seeder"
    tag: ""
    pullPolicy: ""
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
