# ── ArgoCD Application: Sealed Secrets ───────────────────────
# Manages SealedSecret manifests in sealed-secrets/ directory.
# The Sealed Secrets controller (kube-system) automatically
# decrypts SealedSecrets into real Kubernetes Secrets.
#
# This ensures secrets survive cluster recreations — ArgoCD
# re-applies SealedSecrets, controller re-decrypts them.
#
# Apply once:
#   kubectl apply -f argocd/application-sealed-secrets.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubekitchen-sealed-secrets
  namespace: argocd
  labels:
    project: kubekitchen
  annotations:
    # Never auto-delete SealedSecrets (would destroy live secrets)
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/Kubekitchen/Kubekitchen-GitOps.git
    targetRevision: main
    path: sealed-secrets
    # Raw YAML directory — no Helm, no Kustomize
    directory:
      recurse: false
      include: "sealed-secret-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    # No namespace here — each SealedSecret declares its own
    # namespace in metadata.namespace (dev or prod)
    namespace: ""
  syncPolicy:
    automated:
      prune: false      # NEVER auto-delete secrets
      selfHeal: true    # Re-apply if someone manually deletes
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
