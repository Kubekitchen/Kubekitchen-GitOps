apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubekitchen-prod
  namespace: argocd
  labels:
    project: kubekitchen
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Kubekitchen/Kubekitchen-GitOps.git
    targetRevision: main
    path: kubekitchen-helm

    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      releaseName: kubekitchen

  destination:
    server: https://kubernetes.default.svc
    namespace: kubekitchen-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas       # HPA manages replicas
        - /spec/paused         # Rollout controller manages pause state
        - /status              # Rollout controller owns status
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
