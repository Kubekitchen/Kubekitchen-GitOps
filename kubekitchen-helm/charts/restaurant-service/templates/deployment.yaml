{{- if .Values.global.blueGreen }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: restaurant-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "restaurant-service.labels" . | nindent 4 }}
    tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "restaurant-service.selectorLabels" . | nindent 6 }}
  {{- if .Values.global.blueGreen }}
  strategy:
    blueGreen:
      activeService: restaurant-service-active
      previewService: restaurant-service-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "restaurant-service.selectorLabels" . | nindent 8 }}
        {{- include "restaurant-service.labels" . | nindent 8 }}
        tier: backend
      annotations:
        checksum/secret: {{ include "restaurant-service.secretChecksum" . }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccountName }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: restaurant-service
          image: "{{ .Values.image.repository }}:{{ include "restaurant-service.imageTag" . }}"
          imagePullPolicy: {{ include "restaurant-service.imagePullPolicy" . }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: NODE_ENV
              value: {{ .Values.global.nodeEnv | quote }}
            - name: JWT_EXPIRES_IN
              value: {{ .Values.global.jwtExpiresIn | quote }}
            - name: MENU_SERVICE_URL
              value: {{ .Values.global.serviceUrls.menu | quote }}
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: kubekitchen-secrets
                  key: MONGO_RESTAURANT_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubekitchen-secrets
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.probes.startup.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
