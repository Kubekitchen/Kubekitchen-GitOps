{{/*
  kubekitchen-helm/templates/secret.yaml
  ─────────────────────────────────────────────────────────────
  ⚠️  INTENTIONALLY EMPTY — No plain Secret generated here.

  Secrets are managed by Bitnami Sealed Secrets:
    • sealed-secrets/sealed-secret-dev.yaml  → kubekitchen-dev
    • sealed-secrets/sealed-secret-prod.yaml → kubekitchen-prod

  The ArgoCD Application "kubekitchen-sealed-secrets" applies
  those SealedSecret manifests. The Sealed Secrets controller
  (kube-system) decrypts them into actual Kubernetes Secrets.

  To rotate secrets:
    1. Create a new plain Secret YAML (NEVER commit it)
    2. kubeseal --format yaml < new-secret.yaml > sealed-secrets/sealed-secret-<env>.yaml
    3. rm new-secret.yaml
    4. git commit + push → ArgoCD auto-applies

  DO NOT put real credentials in values.yaml or this template.
*/}}
