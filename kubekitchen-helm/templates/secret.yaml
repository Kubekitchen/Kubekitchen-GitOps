{{/*
  kubekitchen-secrets — TEMPLATE ONLY
  ─────────────────────────────────────────────────────────────
  THIS FILE generates a placeholder Secret so Helm validates
  the chart correctly and so developers can see which keys are
  needed.

  ⚠️  FOR PRODUCTION you must use one of:
       • Sealed Secrets (kubeseal)
       • External Secrets Operator + Vault / AWS SSM / GCP SM
       • ArgoCD Vault Plugin

  The values MUST be base64-encoded when written directly to k8s.
  Here we use the "stringData" field so Kubernetes encodes them
  automatically — making the chart self-contained for dev/testing.
  In production this Secret should NOT be committed to Git with
  real values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: kubekitchen-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: kubekitchen
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    project: {{ .Values.global.project }}
    environment: {{ .Values.global.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Instruct ArgoCD not to prune this secret on sync
    # (prevents accidental deletion of live secrets)
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.global.jwtSecret | quote }}
  MONGO_AUTH_URI: {{ .Values.global.mongoUris.auth | quote }}
  MONGO_RESTAURANT_URI: {{ .Values.global.mongoUris.restaurant | quote }}
  MONGO_MENU_URI: {{ .Values.global.mongoUris.menu | quote }}
  MONGO_ORDER_URI: {{ .Values.global.mongoUris.order | quote }}
