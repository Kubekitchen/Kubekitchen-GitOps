{{/*
  auth-service/templates/deployment.yaml
  ────────────────────────────────────────────────────────────
  When global.blueGreen = false  → creates a regular Deployment (dev)
  When global.blueGreen = true   → creates an Argo Rollout with
                                    blue-green strategy (prod)
  Blue  = active service  (live traffic, current stable version)
  Green = preview service (new version, tested before promotion)
*/}}

{{- if .Values.global.blueGreen }}
# ─── PROD: Argo Rollout (Blue-Green) ───────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
# ─── DEV: Regular Deployment (Rolling Update) ──────────────
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
    tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "auth-service.selectorLabels" . | nindent 6 }}
  {{- if .Values.global.blueGreen }}
  # ── Blue-Green Strategy (Argo Rollouts) ──────────────────
  strategy:
    blueGreen:
      # activeService receives live production traffic (Blue)
      activeService: auth-service-active
      # previewService receives the new version for testing (Green)
      previewService: auth-service-preview
      # autoPromotionEnabled: false means you must manually promote
      # green → blue after verifying the new version works
      autoPromotionEnabled: false
      # Wait 30s after promotion before scaling down old (blue) pods
      scaleDownDelaySeconds: 30
  {{- else }}
  # ── Rolling Update Strategy (Dev) ────────────────────────
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "auth-service.selectorLabels" . | nindent 8 }}
        {{- include "auth-service.labels" . | nindent 8 }}
        tier: backend
      annotations:
        checksum/secret: {{ include "auth-service.secretChecksum" . }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: "{{ .Values.image.repository }}:{{ include "auth-service.imageTag" . }}"
          imagePullPolicy: {{ include "auth-service.imagePullPolicy" . }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: NODE_ENV
              value: {{ .Values.global.nodeEnv | quote }}
            - name: JWT_EXPIRES_IN
              value: {{ .Values.global.jwtExpiresIn | quote }}
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: kubekitchen-secrets
                  key: MONGO_AUTH_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubekitchen-secrets
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.probes.startup.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}