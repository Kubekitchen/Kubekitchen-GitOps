# ╔══════════════════════════════════════════════════════════╗
# ║         KubeKitchen Global Values (Umbrella)            ║
# ║  All sub-charts inherit and can override these values   ║
# ╚══════════════════════════════════════════════════════════╝

# ── Global Settings ─────────────────────────────────────────
global:
  # Docker image settings
  imageRegistry: "docker.io"
  imageOwner: "secretpower"
  imageTag: "dev-latest"
  imagePullPolicy: Always
  # Blue-Green deployment strategy (requires Argo Rollouts)
  # false = regular Deployment (dev) | true = Argo Rollout blue-green (prod)
  blueGreen: false
  # Environment
  environment: dev
  namespace: kubekitchen-dev
  # Project labels
  project: kubekitchen
  # JWT Secret (override per environment — use Sealed Secrets / ESO in prod)
  jwtSecret: "dev-jwt-secret-change-this-256bit-key"
  jwtExpiresIn: "7d"
  # Node environment
  nodeEnv: "development"
  # Storage class (must exist in your cluster — matches your NFS provisioner)
  storageClass: "kubekitchen-nfs"
  # Service account (created once in umbrella templates/)
  serviceAccountName: "kubekitchen-sa"
  # MongoDB connection URIs (consumed by services via Secret)
  mongoUris:
    auth: "mongodb://mongodb-auth-0.mongodb-auth-headless:27017/authdb"
    restaurant: "mongodb://mongodb-restaurant-0.mongodb-restaurant-headless:27017/restaurantdb"
    menu: "mongodb://mongodb-menu-0.mongodb-menu-headless:27017/menudb"
    order: "mongodb://mongodb-order-0.mongodb-order-headless:27017/orderdb"
  # Internal ClusterIP service URLs (injected as env vars into containers)
  serviceUrls:
    auth: "http://auth-service:4001"
    restaurant: "http://restaurant-service:4002"
    menu: "http://menu-service:4003"
    order: "http://order-service:4004"
# ── Auth Service ─────────────────────────────────────────────
auth-service:
  enabled: true
  replicaCount: 1
  image:
    repository: "secretpower/kubekitchen-auth-service"
    tag: "v1.0.8" # Empty = falls back to global.imageTag
    pullPolicy: "" # Empty = falls back to global.imagePullPolicy
  service:
    port: 4001
    targetPort: 4001
    type: ClusterIP
  resources:
    requests:
      memory: "128Mi"
      cpu: "30m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  probes:
    liveness:
      path: /health
      port: 4001
      initialDelaySeconds: 25
      periodSeconds: 15
    readiness:
      path: /health
      port: 4001
      initialDelaySeconds: 10
      periodSeconds: 10
    startup:
      path: /health
      port: 4001
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 10
