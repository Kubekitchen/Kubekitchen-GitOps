apiVersion: v2
name: kubekitchen
description: KubeKitchen Cloud Kitchen Platform - Umbrella Helm Chart
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - kubekitchen
  - cloud-kitchen
  - microservices
maintainers:
  - name: secretpower
    email: admin@kubekitchen.io
dependencies:
  - name: auth-service
    version: "1.0.0"
    repository: "file://charts/auth-service"
    condition: auth-service.enabled
  - name: restaurant-service
    version: "1.0.0"
    repository: "file://charts/restaurant-service"
    condition: restaurant-service.enabled
  - name: menu-service
    version: "1.0.0"
    repository: "file://charts/menu-service"
    condition: menu-service.enabled
  - name: order-service
    version: "1.0.0"
    repository: "file://charts/order-service"
    condition: order-service.enabled
  - name: frontend
    version: "1.0.0"
    repository: "file://charts/frontend"
    condition: frontend.enabled
  - name: mongodb
    version: "1.0.0"
    repository: "file://charts/mongodb"
    condition: mongodb.enabled
  - name: seeder
    version: "1.0.0"
    repository: "file://charts/seeder"
    condition: seeder.enabled
